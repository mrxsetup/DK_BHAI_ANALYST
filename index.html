<!DOCTYPE html>

<style>
/* ---------- NEON RECTANGULAR BOX ---------- */
.neon-box {
    display: inline-block;
    padding: 12px 22px;
    border-radius: 14px;
    border: 2px solid #00faff;
    box-shadow: 0 0 10px #00faff, 0 0 25px #00faff;
    animation: neonGlow 2s infinite alternate;
}
@keyframes neonGlow {
    from { box-shadow: 0 0 10px #00faff; }
    to { box-shadow: 0 0 35px #00faff; }
}
.neon-text {
    font-weight: 900;
    font-size: 1.8rem;
    color: #ffffff;
    text-shadow: 0 0 6px #00faff, 0 0 12px #00faff;
}
.sub-text {
    font-weight: 800;
    color: #ffb300;
    text-shadow: 0 0 8px rgba(255,179,0,0.8);
}

/* ---------- PROFILE MIRROR ---------- */
.mirror-wrap {
    position: relative;
    width: 140px;
    height: 140px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at top, #444, #000 70%);
    box-shadow:
        inset 0 8px 15px rgba(255,255,255,0.2),
        inset 0 -10px 20px rgba(0,0,0,0.9),
        0 0 25px rgba(0,255,255,0.6);
}
.mirror-wrap::before {
    content: "";
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    background: conic-gradient(#00faff,#ff00ff,#00ff6a,#00faff);
    animation: spin 4s linear infinite;
    filter: blur(2px);
    z-index: -1;
}
@keyframes spin { to { transform: rotate(360deg); } }
.mirror-img {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
}

/* ---------- NEON BUTTON ---------- */
.neon-btn {
    background: #00faff;
    color: #ff003c;
    padding: 14px 20px;
    border-radius: 14px;
    font-weight: 900;
    box-shadow: 0 0 15px #00faff, 0 0 35px #00faff;
    animation: pulse 1.8s infinite;
}
@keyframes pulse {
    0%,100% { box-shadow: 0 0 15px #00faff; }
    50% { box-shadow: 0 0 45px #00faff; }
}

/* ---------- OVERLAY ---------- */
.overlay {
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.45);
}

/* ---------- ADS CREDIT ---------- */
.ads-credit {
    font-size: 10px;
    letter-spacing: 1px;
    color: #00faff;
    text-shadow:
        0 0 5px #00faff,
        0 0 10px #00faff;
    opacity: 0.9;
}
</style>
</head>

<body class="bg-black text-white">

<!-- ADS CREDIT BOTTOM -->
<div class="mt-auto pt-4 pb-2 ads-credit">

</div>

<script>
let t=30,el=document.getElementById("countdown");

el.textContent=t; t--;

</html>

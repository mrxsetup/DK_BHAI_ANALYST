<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DK BHAI (CRICKET_ANALYST)2016</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
/* ---------- PROFILE MIRROR EFFECT ---------- */
.mirror-wrap {
    position: relative;
    width: 140px;
    height: 140px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at top, #444, #000 70%);
    box-shadow:
        inset 0 8px 15px rgba(255,255,255,0.2),
        inset 0 -10px 20px rgba(0,0,0,0.9),
        0 0 25px rgba(0,255,255,0.6);
}

.mirror-wrap::before {
    content: "";
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    background: conic-gradient(
        #00faff,
        #ff00ff,
        #00ff6a,
        #00faff
    );
    animation: spin 4s linear infinite;
    filter: blur(2px);
    z-index: -1;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.mirror-img {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    box-shadow:
        inset 0 6px 12px rgba(0,0,0,0.7);
}

/* ---------- NEON BUTTON ---------- */
.neon-btn {
    position: relative;
    color: #ff003c;
    background: #00faff;
    padding: 14px 18px;
    border-radius: 12px;
    font-weight: bold;
    letter-spacing: 1px;
    box-shadow:
        0 0 15px #00faff,
        0 0 30px #00faff;
    animation: neonPulse 1.8s infinite;
}

.neon-btn::after {
    content: "";
    position: absolute;
    inset: -3px;
    border-radius: 12px;
    background: linear-gradient(90deg,#00faff,#ff00ff,#00faff);
    filter: blur(8px);
    opacity: 0.9;
    z-index: -1;
}

@keyframes neonPulse {
    0%,100% { box-shadow: 0 0 15px #00faff; }
    50% { box-shadow: 0 0 35px #00faff; }
}

/* ---------- OVERLAY ---------- */
.overlay {
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.45);
}
</style>
</head>

<body class="bg-black text-white">

<div class="relative h-screen flex items-center justify-center bg-cover bg-center"
style="background-image:url('https://github.com/mrxsetup/DK_BHAI_ANALYST/blob/main/DKBHAI%20LOGO.jpg?raw=true');">

<div class="overlay"></div>

DK BHAI<br>

<!-- MIRROR PROFILE -->

    <div class="mirror-wrap">
        <img src="https://github.com/mrxsetup/DK_BHAI_ANALYST/blob/main/DKBHAI%20LOGO.jpg?raw=true"
        class="mirror-img">
    </div>
</div>

<!-- COUNTDOWN -->
<p class="mt-4 text-xl">
Join Now <span id="countdown" class="text-yellow-400 text-3xl">30</span> Seconds
</p>

<p class="mt-3 text-sm font-semibold">
Join Karo Enjoy Daily Cricket Prediction 👇
</p>

<!-- NEON BUTTON -->
<div class="mt-8">
<a href="https://t.me/+T-mZ4GnpUmg1OTll">
    <button class="neon-btn">
        JOIN DK BHAI TELEGRAM CHANNEL
    </button>
</a>
</div>

<p class="mt-4 text-sm uppercase font-semibold">
💸 DK BHAI <br> Cricket Tipping Ki Duniya Ka King 👑
</p>

</div>
</div>

<script>
let t=30,el=document.getElementById("countdown");
let i=setInterval(()=>{
el.textContent=t; t--;
if(t<0){clearInterval(i);el.textContent="0";}
},1000);
</script>

</body>
</html>
